name: CI e deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-etl.txt
      # Princípio VI — testes-first no ETL em Python
      - run: |
          PYTHONPATH=. python -m flake8 etl tests/etl
          PYTHONPATH=. python -m isort --check-only etl tests/etl
          PYTHONPATH=. python -m black --check etl tests/etl
          PYTHONPATH=. python -m pytest -q tests/etl
      # Portão de contrato do pacote commitado (spec 011 — sem rodar o ETL: as
      # entradas do ETL são gitignored e não existem no CI; em clone o check-dados
      # valida o contrato e emite apenas a linha INFO: de entradas ausentes, exit 0)
      - run: PYTHONPATH=. python -m etl.scripts.check_dados
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
